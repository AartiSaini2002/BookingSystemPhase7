<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservations | Booking System</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: "#e10e49",
                            light: "#ffffff",
                            dark: "#1e1e1e",
                            blue: "#263f6a",
                            green: "#284e36",
                            orange: "#e37222",
                            rose: "#c24d52",
                        }
                    },
                    boxShadow: {
                        soft: "0 8px 40px rgba(0, 0, 0, 0.45)",
                    }
                }
            }
        }
    </script>

    <!-- JS -->
    <script type="module" src="js/reservations.js" defer></script>
</head>

<body class="min-h-screen flex flex-col bg-brand-light text-brand-dark">

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-brand-dark text-white shadow-soft">
    <div class="mx-auto max-w-7xl px-6 flex justify-between h-16 items-center">
        <a href="/" class="flex items-center gap-3">
            <img src="logo.svg" alt="Booking System" class="h-10 w-10">
            <div>
                <span class="block text-sm font-semibold">Booking System</span>
                <span class="text-xs text-white/70">Secure resource booking</span>
            </div>
        </a>

        <nav class="flex gap-3">
            <a href="/resources" class="rounded-xl border px-4 py-2 text-sm hover:bg-white/10">Resources</a>
            <a href="/reservations" class="rounded-xl border px-4 py-2 text-sm bg-white/10">Reservations</a>
            <button onclick="logout()" class="rounded-xl bg-brand-primary px-4 py-2 text-sm text-white">
                Sign out
            </button>
        </nav>
    </div>
</header>

<!-- MAIN -->
<main class="mx-auto max-w-7xl px-6 flex-grow">

<!-- TITLE -->
<section class="py-12">
    <div class="bg-white p-8 rounded-3xl shadow-soft">
        <h1 class="text-3xl font-semibold">Reservations</h1>
        <p class="text-sm text-black/60 mt-2">
            Create, update, and manage reservations.
        </p>
    </div>
</section>

<!-- CONTENT -->
<section class="pb-16">
<div class="grid gap-8 lg:grid-cols-12">

<!-- FORM -->
<div class="lg:col-span-8">
<div class="bg-white p-8 rounded-3xl shadow-soft">

<h2 class="text-xl font-semibold">Reservation Form</h2>

<div id="formMessage" class="hidden mt-4 p-3 rounded-xl text-sm"></div>

<form id="reservationForm" class="mt-6 space-y-5">

<input type="hidden" id="id">

<!-- Resource -->
<div>
<label class="block text-sm font-semibold">Resource ID</label>
<input id="resourceId" type="number" placeholder="Enter resource ID"
class="mt-2 w-full rounded-2xl border px-4 py-3">
</div>

<!-- User -->
<div>
<label class="block text-sm font-semibold">User ID</label>
<input id="userId" type="number"  placeholder="Enter user ID"
class="mt-2 w-full rounded-2xl border px-4 py-3">
</div>

<!-- Start -->
<div>
<label class="block text-sm font-semibold">Start Time</label>
<input id="startTime" type="datetime-local" placeholder="Select start time"
class="mt-2 w-full rounded-2xl border px-4 py-3">
</div>

<!-- End -->
<div>
<label class="block text-sm font-semibold">End Time</label>
<input id="endTime" type="datetime-local" placeholder="Select end time"
class="mt-2 w-full rounded-2xl border px-4 py-3">
</div>

<!-- Note -->
<div>
<label class="block text-sm font-semibold">Note</label>
<input id="note" type="text" placeholder="Enter note"
class="mt-2 w-full rounded-2xl border px-4 py-3">
</div>

<!-- Status -->
<div>
<label for="status" class="block text-sm font-semibold">
  Status
</label>

<select id="status" class="mt-2 w-full rounded-2xl border px-4 py-3">
  <option value="active">Active</option>
  <option value="cancelled">Cancelled</option>
</select>
</div>

<!-- BUTTONS -->
<div class="grid gap-4 sm:grid-cols-2 mt-6">

<button type="button" id="createBtn"
    class="rounded-2xl bg-brand-primary px-4 py-3 text-white">
    Create
</button>

<button type="button" id="updateBtn"
   class="rounded-2xl bg-brand-primary px-4 py-3 text-white">
    Update
</button>

<button type="button" id="deleteBtn"
    class="rounded-2xl bg-brand-primary px-4 py-3 text-white">
    Delete
</button>

<button type="button" id="clearBtn"
    class="rounded-2xl bg-brand-primary px-4 py-3 text-white">
    Clear
</button>

</div>

</form>
</div>
</div>

<!-- LIST -->
<div class="lg:col-span-4">
<div class="bg-white p-6 rounded-3xl shadow-soft">

<h3 class="font-semibold">Reservation list</h3>

<p class="text-xs text-black/50 mt-2">
Click an item to edit or delete it.
</p>

<div id="reservationList" class="mt-4 space-y-3"></div>

</div>
</div>

</div>
</section>

</main>

<!-- FOOTER -->
<footer class="bg-brand-dark text-white">
    <div class="max-w-7xl mx-auto px-6 py-6 text-xs text-white/60">
        © <span id="year"></span> Booking System
    </div>
</footer>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
